l_simp_chinese:
 beiyang.1.t: "岁值辛卯"
 beiyang.1.d: "新的一年来到了,北洋总统府内贴满了各种对联,官员们交谈最近的喜事儿,分享着年货和自己珍藏的东西,尽管北洋的政府体系不怎么高效,但由于一直有齐这个主心骨撑着北洋才能延续到今天,“大总统到!”随着卫兵的发声,所有人都望向了总统府的楼梯“大家新年好”齐总统在楼梯上说着,一边拿出了早就准备好的新年贺礼准备发给自己的政府官员。"
 beiyang.1.a: "“大总统新年好!”"
 taiwan.1.t: "粮食危机"
 taiwan.1.d: "“该死的……”李伟光默念着，迈着沉重的脚步步入议会会堂。就在2小时前，他的秘书满头大汗的冲进办公室，提交了德国停止供给粮食的文件。\n“他们的理由是什么？”李伟光一头冷汗问到。\n“船只不足，运不过来。”\n“真是随便找个理由就搪塞过去了……你现在约谈德国大使，我立刻去议会提交报告。”\n“是。”"
 taiwan.1.a: "寄人篱下的无奈。"